[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-skills-manager"
version = "1.0.2"
description = "Skills Manager: scan, install, update, and analyze AI agent skills safely across Claude, Cursor, Codex, and OpenCode."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mazin Ahmed" }]
keywords = [
    "ai-agents",
    "skills",
    "security",
    "supply-chain",
    "claude",
    "cursor",
    "codex",
    "opencode",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mazen160/skills-manager"
Repository = "https://github.com/mazen160/skills-manager"
Issues = "https://github.com/mazen160/skills-manager/issues"
Changelog = "https://github.com/mazen160/skills-manager/blob/main/CHANGELOG.md"
"PyPI" = "https://pypi.org/project/agentic-skills-manager/"

[project.scripts]
skill = "skills_manager:main"
skills = "skills_manager:main"
skill-manager = "skills_manager:main"
skills-manager = "skills_manager:main"
agentic-skill-manager = "skills_manager:main"
agentic-skills-manager = "skills_manager:main"

[tool.setuptools]
py-modules = ["skills_manager"]
