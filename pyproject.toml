[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-py"
version = "0.1.0"
description = "Scan, install, and update AI agent skills safely across Claude, Cursor, Codex, and OpenCode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mazin Ahmed" }]
keywords = [
    "ai-agents",
    "skills",
    "security",
    "supply-chain",
    "claude",
    "cursor",
    "codex",
    "opencode",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mazen160/skills.py"
Repository = "https://github.com/mazen160/skills.py"
Issues = "https://github.com/mazen160/skills.py/issues"

[project.scripts]
skills = "skills:main"

[tool.setuptools]
py-modules = ["skills"]
